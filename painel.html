/* Layout: manager dashboard. Summary tiles on top, then one row per creator in posting order: date, status pill, progress, Reels steps, Stories weeks. */
:root {
  --bg: #0a0e27; --bg-2: #0f1435; --surface: #141a44; --surface-2: #1b2254; --line: #262e66;
  --ink: #f3f1ec; --muted: #a4a9d0; --faint: #6f76a8;
  --accent: #ff6b2c; --accent-soft: rgba(255,107,44,.14); --on-accent: #1a0a02;
  --ok: #3ddc97; --ok-soft: rgba(61,220,151,.14); --warn: #ffc24b; --warn-soft: rgba(255,194,75,.14); --bad: #ff5a6e; --bad-soft: rgba(255,90,110,.14);
  --g1: linear-gradient(160deg, #ff6b2c 0%, #b8306b 55%, #2a1a6e 100%);
  --g2: linear-gradient(160deg, #2b3fb8 0%, #5b2ca0 60%, #13123a 100%);
  --g3: linear-gradient(160deg, #0f8b8d 0%, #1d3c8f 60%, #0b0f2c 100%);
  --g4: linear-gradient(160deg, #e2a21b 0%, #d4472a 55%, #3b1340 100%);
  --g5: linear-gradient(160deg, #4b5bff 0%, #ff6b2c 100%);
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.top { border-bottom: 1px solid var(--line); }
.top .wrap { min-height: 60px; display: flex; align-items: center; gap: 14px; }

.top .t { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.top .sp { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
main { padding-block: 28px 60px; display: grid; gap: 22px; }
h1 { font-family: var(--f-display); font-stretch: 112%; font-weight: 900; text-transform: uppercase; font-size: clamp(28px, 5vw, 52px); line-height: .95; margin: 0; overflow-wrap: anywhere; }
.sub { color: var(--muted); margin: 8px 0 0; font-size: 14px; }

.login { max-width: 400px; margin: 10vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 26px; display: grid; gap: 14px; }
.login h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 850; text-transform: uppercase; margin: 0; font-size: 24px; }
.login input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 4px; }
.tile .v { font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--muted); font-size: 13.5px; }
.tile.bad .v { color: var(--bad); }
.tile.ok .v { color: var(--ok); }

.rows { display: grid; gap: 12px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; grid-template-columns: 64px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 18px; align-items: center; }
.row.late { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }
.dt { border-radius: 14px; background: var(--g); color: #fff; text-align: center; padding: 8px 0; line-height: 1; }
.dt b { display: block; font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 26px; }
.dt small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .14em; }
.who b { display: block; font-size: 17px; }
.who span { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--surface-2); color: var(--muted); }
.prog { display: grid; gap: 6px; }
.prog .bar { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--ok); border-radius: 8px; transition: width .5s; }
.prog .n { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .n b { color: var(--ink); }
.marks { display: grid; gap: 8px; }
.marks .g { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.marks .g .label { width: 62px; flex: 0 0 auto; }
.m { display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 8px; font-family: var(--f-mono); font-size: 11px; font-weight: 700; background: var(--bg-2); color: var(--faint); border: 1px solid var(--line); }
.m.on { background: var(--ok); color: #05261a; border-color: transparent; }
.when { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); }
.empty { color: var(--muted); text-align: center; padding: 30px; }

@media (max-width: 860px) {
  .row { grid-template-columns: 56px minmax(0, 1fr); }
  .row .prog, .row .marks { grid-column: 1 / -1; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

<body>
<header class="top"><div class="wrap"><a href="/" aria-label="Voltar ao site"><span class="logo" role="img" aria-label="Skyfit Santa Isabel" style="display:block"></span></a><span class="t">Painel do gestor</span>
  <span class="sp" id="actions" hidden><button class="btn" id="refresh" type="button">Atualizar</button><button class="btn" id="logout" type="button">Sair</button></span></div></header>

</div>

<script>
const DATA = {"pessoas": [{"slug": "alan-news", "nome": "Alan Fernandes (Alan News)", "arroba": "@alannews", "cupom": "ALAN10", "post": {"d": 9, "dia": "sexta", "data": "09/10", "gravar": "06/10", "aprovar": "08/10"}}, {"slug": "gisele-grenza", "nome": "Gisele Grenza", "arroba": "@giselegrenza", "cupom": "GISELE10", "post": {"d": 14, "dia": "quarta", "data": "14/10", "gravar": "11/10", "aprovar": "13/10"}}, {"slug": "paola-igarasi", "nome": "Paola Igarasi", "arroba": "@paolaigarasi", "cupom": "PAOLA10", "post": {"d": 19, "dia": "segunda", "data": "19/10", "gravar": "16/10", "aprovar": "18/10"}}, {"slug": "lucas-lemos", "nome": "Lucas Lemos", "arroba": "@aesthetic.lemos", "cupom": "LEMOS10", "post": {"d": 24, "dia": "sábado", "data": "24/10", "gravar": "21/10", "aprovar": "23/10"}}, {"slug": "caio-tanaka", "nome": "Caio Tanaka", "arroba": "@caio_tanaka5", "cupom": "TANAKA10", "post": {"d": 30, "dia": "sexta", "data": "30/10", "gravar": "27/10", "aprovar": "29/10"}}]};
const GRAD = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)', 'var(--g5)'];
const WEEKS = ['S1', 'S2', 'S3', 'S4'];
const REELS = [['r1', 'Gravado'], ['r2', 'Aprovação'], ['r3', 'Postado']];
const TOTAL = 3 + 8;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let key = '';
try { key = sessionStorage.getItem('painel-senha') || ''; } catch {}

function today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function dayDiff(d) { return Math.round((new Date(2026, 9, d) - today()) / 864e5); }
function ago(iso) {
  if (!iso) return 'sem marcações ainda';
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 1) return 'atualizado agora';
  if (m < 60) return `atualizado há ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `atualizado há ${h} h`;
  return `atualizado há ${Math.round(h / 24)} dia(s)`;
}
function status(p, t) {
  const post = dayDiff(p.post.d), grav = dayDiff(p.post.d - 3);
  if (t.r3) return ['ok', 'Reels no ar'];
  if (post < 0) return ['bad', `Reels atrasado ${-post} dia(s)`];
  if (post === 0) return ['warn', 'Posta hoje'];
  if (grav < 0 && !t.r1) return ['bad', 'Gravação atrasada'];
  if (post <= 3) return ['warn', `Posta em ${post} dia(s)`];
  return ['idle', `Faltam ${post} dias`];
}

async function load() {
  $('stamp').textContent = 'Carregando…';
  let r;
  try { r = await fetch('/api/painel', { headers: { 'x-painel-senha': key }, cache: 'no-store' }); }
  catch { $('stamp').textContent = 'Sem conexão. Tenta atualizar de novo.'; return false; }
  if (r.status === 401) return 'auth';
  if (!r.ok) { const j = await r.json().catch(() => ({})); $('stamp').textContent = 'Erro: ' + (j.error || r.status); return false; }
  const { rows } = await r.json();
  const by = {}; rows.forEach(x => { (by[x.slug] = by[x.slug] || { t: {}, last: null }); by[x.slug].t[x.task] = x.done; if (!by[x.slug].last || x.updated_at > by[x.slug].last) by[x.slug].last = x.updated_at; });
  render(by);
  $('stamp').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' · atualiza sozinho a cada minuto';
  return true;
}

function render(by) {
  let done = 0, live = 0, late = 0;
  const rows = DATA.pessoas.map((p, i) => {
    const s = by[p.slug] || { t: {}, last: null };
    const n = Object.values(s.t).filter(Boolean).length; done += n;
    if (s.t.r3) live++;
    const [cls, txt] = status(p, s.t); if (cls === 'bad') late++;
    const pct = Math.round(n / TOTAL * 100);
    const stories = WEEKS.map((w, k) => { const c = (s.t[`s${k}a`] ? 1 : 0) + (s.t[`s${k}b`] ? 1 : 0); return `<span class="m ${c === 2 ? 'on' : ''}" title="${w}: ${c} de 2 sequências">${w} ${c}/2</span>`; }).join('');
    return `<article class="row ${cls === 'bad' ? 'late' : ''}">
      <div class="dt" style="--g:${GRAD[i % GRAD.length]}"><b>${String(p.post.d).padStart(2, '0')}</b><small>OUT</small></div>
      <div class="who"><b>${esc(p.nome)}</b><span>${esc(p.arroba)} · ${esc(p.cupom)}</span><br><span class="pill ${cls}">${txt}</span></div>
      <div class="prog"><div class="n"><span><b>${n}</b>/${TOTAL} tarefas</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><span class="when">${ago(s.last)}</span></div>
      <div class="marks">
        <div class="g"><span class="label">Reels</span>${REELS.map(([id, l]) => `<span class="m ${s.t[id] ? 'on' : ''}">${l}</span>`).join('')}</div>
        <div class="g"><span class="label">Stories</span>${stories}</div>
      </div>
    </article>`;
  }).join('');
  $('rows').innerHTML = rows || '<p class="empty">Nenhum criador cadastrado.</p>';
  const all = DATA.pessoas.length * TOTAL;
  $('tiles').innerHTML = `
    <div class="tile"><span class="v">${Math.round(done / all * 100)}%</span><span class="k">do mês concluído</span></div>
    <div class="tile ok"><span class="v">${live}/${DATA.pessoas.length}</span><span class="k">Reels no ar</span></div>
    <div class="tile ${late ? 'bad' : ''}"><span class="v">${late}</span><span class="k">com atraso</span></div>
    <div class="tile"><span class="v">${done}</span><span class="k">tarefas marcadas</span></div>`;
}

async function enter() {
  const res = await load();
  if (res === 'auth') { key = ''; try { sessionStorage.removeItem('painel-senha'); } catch {} $('dash').hidden = true; $('actions').hidden = true; $('login').hidden = false; $('err').textContent = 'Senha errada. Tenta de novo.'; return; }
  $('login').hidden = true; $('dash').hidden = false; $('actions').hidden = false;
}
$('login').addEventListener('submit', e => {
  e.preventDefault(); key = $('senha').value.trim(); $('err').textContent = '';
  try { sessionStorage.setItem('painel-senha', key); } catch {}
  enter();
});
$('refresh').addEventListener('click', load);
$('logout').addEventListener('click', () => { key = ''; try { sessionStorage.removeItem('painel-senha'); } catch {} location.reload(); });
setInterval(() => { if (!$('dash').hidden) load(); }, 60000);
if (key) enter();
</script>
</body>
</html>
