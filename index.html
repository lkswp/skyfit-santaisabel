/* Layout: creator-native content plan. Home = hero scoreboard + roster + October calendar. Creator = hero with coupon ticket, sticky section rail, Reels shown inside a phone, Stories as real 9:16 frames, weekly split, personal checklist. Dark-first (navy ink), light variant mirrored. */
:root {
  --bg: #0a0e27;
  --bg-2: #0f1435;
  --surface: #141a44;
  --surface-2: #1b2254;
  --line: #262e66;
  --ink: #f3f1ec;
  --muted: #a4a9d0;
  --faint: #6f76a8;
  --accent: #ff6b2c;
  --accent-soft: rgba(255,107,44,.14);
  --on-accent: #1a0a02;
  --cobalt: #8796ff;
  --cobalt-soft: rgba(135,150,255,.14);
  --ok: #3ddc97;
  --device: #05060f;
  --device-ink: #ffffff;
  --g1: linear-gradient(160deg, #ff6b2c 0%, #b8306b 55%, #2a1a6e 100%);
  --g2: linear-gradient(160deg, #2b3fb8 0%, #5b2ca0 60%, #13123a 100%);
  --g3: linear-gradient(160deg, #0f8b8d 0%, #1d3c8f 60%, #0b0f2c 100%);
  --g4: linear-gradient(160deg, #e2a21b 0%, #d4472a 55%, #3b1340 100%);
  --g5: linear-gradient(160deg, #4b5bff 0%, #ff6b2c 100%);
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r-lg: 22px; --r: 16px;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 50px -24px rgba(0,0,0,.6);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f5fb; --bg-2: #eceef8; --surface: #ffffff; --surface-2: #f0f2fa; --line: #dde1f0;
  --ink: #0e1333; --muted: #555b85; --faint: #8a90b5; --accent: #f0531a;
  --accent-soft: rgba(240,83,26,.10); --on-accent: #ffffff; --cobalt: #2a3cb5; --cobalt-soft: rgba(42,60,181,.08); --ok: #12a36b;
  --shadow: 0 1px 2px rgba(14,19,51,.04), 0 18px 40px -22px rgba(14,19,51,.25); color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f4f5fb; --bg-2: #eceef8; --surface: #ffffff; --surface-2: #f0f2fa; --line: #dde1f0;
  --ink: #0e1333; --muted: #555b85; --faint: #8a90b5; --accent: #f0531a;
  --accent-soft: rgba(240,83,26,.10); --on-accent: #ffffff; --cobalt: #2a3cb5; --cobalt-soft: rgba(42,60,181,.08); --ok: #12a36b;
  --shadow: 0 1px 2px rgba(14,19,51,.04), 0 18px 40px -22px rgba(14,19,51,.25); color-scheme: light }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; margin: 0; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-inline: 20px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.label { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.display { font-family: var(--f-display); font-stretch: 122%; font-weight: 900; text-transform: uppercase; line-height: .92; letter-spacing: -.012em; text-wrap: balance; margin: 0; }
.h2 { font-family: var(--f-display); font-stretch: 115%; font-weight: 850; text-transform: uppercase; font-size: clamp(26px, 3.6vw, 40px); line-height: 1; margin: 0; text-wrap: balance; }
.h3 { font-family: var(--f-display); font-stretch: 108%; font-weight: 800; text-transform: uppercase; font-size: 18px; letter-spacing: .01em; margin: 0; }
.sec-head { display: grid; gap: 10px; margin-bottom: 26px; }
.sec-head p { margin: 0; color: var(--muted); max-width: 60ch; }
.cp { font-family: var(--f-mono); font-weight: 700; font-style: normal; color: var(--accent); white-space: nowrap; }

/* top bar */
.top { position: relative; z-index: 5; border-bottom: 1px solid var(--line); background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 18px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; background: none; border: 0; cursor: pointer; padding: 0; }

.brand:hover .logo, .brand:focus-visible .logo { background: #e3162b; filter: drop-shadow(0 4px 14px rgba(227,22,43,.6)); }
.people { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 4px; }
.people::-webkit-scrollbar { display: none; }
.pill { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); transition: background .2s, color .2s, border-color .2s; }
.pill:hover { color: var(--ink); background: var(--surface); }
.pill[aria-current="page"] { color: var(--ink); background: var(--surface); border-color: var(--line); }
.pill .av { width: 26px; height: 26px; font-size: 11px; }
.pill span.n { font-weight: 600; font-size: 14px; }
.av { border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-stretch: 115%; font-weight: 900; color: #fff; flex: 0 0 auto; text-transform: uppercase; letter-spacing: .02em; }

.view { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
.has-motion .view { animation: none; }
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
.wi { display: inline-block; will-change: transform; }
.readbar { position: fixed; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); z-index: 60; pointer-events: none; }
.tilt { transform-style: preserve-3d; will-change: transform; }
@keyframes rise { from { opacity: .001; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* home hero */
.hero { position: relative; padding-block: 64px 54px; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -10%; top: -40%; width: 70vw; max-width: 900px; aspect-ratio: 1; background: radial-gradient(closest-side, var(--accent-soft), transparent 70%); pointer-events: none; }
.hero .wrap { position: relative; display: grid; gap: 26px; }
.hero h1 { font-size: clamp(44px, 9vw, 124px); }
.hero h1 .o { color: var(--accent); }
.hero h1 .stroke { color: transparent; -webkit-text-stroke: 2px var(--ink); }
.hero .lede { font-size: clamp(17px, 1.6vw, 20px); color: var(--muted); max-width: 54ch; margin: 0; }
.score { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; margin-top: 10px; }
.score > div { padding: 22px 24px; border-right: 1px solid var(--line); display: grid; gap: 6px; }
.score > div:last-child { border-right: 0; }
.score .v { font-family: var(--f-display); font-stretch: 120%; font-weight: 900; font-size: clamp(32px, 4.4vw, 52px); line-height: 1; font-variant-numeric: tabular-nums; }
.score .v small { font-size: .45em; color: var(--muted); font-weight: 800; margin-left: 4px; }
.score .k { color: var(--muted); font-size: 14px; }

section.block { padding-block: 44px; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 16px; }
.card { position: relative; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 18px; box-shadow: var(--shadow); transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s; overflow: hidden; }
.card::after { content: ""; position: absolute; right: -30%; bottom: -60%; width: 70%; aspect-ratio: 1; border-radius: 50%; background: var(--cg); opacity: .16; filter: blur(30px); transition: opacity .3s; pointer-events: none; }
.card:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.card:hover::after { opacity: .32; }
.card .row1 { display: flex; gap: 14px; align-items: center; }
.card .av { width: 54px; height: 54px; font-size: 19px; }
.card .nm { font-family: var(--f-display); font-stretch: 112%; font-weight: 850; font-size: 21px; text-transform: uppercase; line-height: 1.05; }
.card .hd { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.card .reel { display: grid; gap: 4px; position: relative; z-index: 1; }
.card .reel b { font-weight: 600; font-size: 15.5px; line-height: 1.35; }
.card .row3 { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; z-index: 1; }
.tag { font-family: var(--f-mono); font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); letter-spacing: .04em; white-space: nowrap; }
.card .go { font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; transition: color .2s, gap .2s; }
.card:hover .go { color: var(--ink); gap: 10px; }

.deliver { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.dv { border-radius: var(--r-lg); padding: 28px; display: grid; gap: 12px; align-content: start; border: 1px solid var(--line); background: var(--surface); }
.dv.hot { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.dv .big { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 72px; line-height: .85; }
.dv .t { font-family: var(--f-display); font-stretch: 112%; font-weight: 850; font-size: 22px; text-transform: uppercase; }
.dv p { margin: 0; opacity: .9; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; margin-top: 16px; }
.rule { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 16px 18px; border-radius: var(--r); background: var(--bg-2); border: 1px solid var(--line); font-size: 15px; }
.rule svg { width: 20px; height: 20px; color: var(--accent); margin-top: 2px; }

.calwrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.cal { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 18px; box-shadow: var(--shadow); }
.cal .dow, .cal .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow div { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--faint); text-align: center; padding-bottom: 8px; text-transform: uppercase; }
.day { aspect-ratio: 1 / .9; border-radius: 10px; background: var(--bg-2); padding: 7px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; }
.day.empty { background: transparent; }
.day .dots { display: flex; gap: 3px; }
.day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cobalt); }
.day.ev { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.day.dl { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.day.post { background: var(--pg); color: #fff; font-weight: 700; border: 0; cursor: pointer; text-align: left; box-shadow: 0 8px 20px -8px rgba(0,0,0,.5); }
.day.post .ini { font-family: var(--f-display); font-stretch: 115%; font-weight: 900; font-size: 12px; letter-spacing: .02em; }
.day.post:hover { filter: brightness(1.1); }
.ag { display: grid; grid-template-columns: 58px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; width: 100%; transition: border-color .2s; }
.ag:hover { border-color: var(--accent); }
.ag .dt { border-radius: 12px; background: var(--pg); color: #fff; display: grid; place-items: center; padding: 6px 0; line-height: 1; }
.ag .dt b { font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 22px; }
.ag .dt small { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em; margin-top: 3px; }
.ag .who { min-width: 0; }
.ag .who b { display: block; font-size: 15px; }
.ag .who span { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .wd { font-family: var(--f-mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
.cdate { position: absolute; top: 18px; right: 18px; z-index: 1; text-align: center; line-height: 1; border-radius: 12px; padding: 7px 10px; background: var(--accent); color: var(--on-accent); }
.cdate b { display: block; font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 22px; }
.cdate small { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .14em; font-weight: 700; }
.card .row1 { padding-right: 64px; }
.side { display: grid; gap: 16px; justify-items: stretch; min-width: 0; }
.when { border-radius: 18px; background: var(--surface); border: 2px solid var(--accent); padding: 16px 18px; display: grid; gap: 14px; }
.when .top { display: flex; align-items: center; gap: 16px; }
.when .cal-ic { width: 72px; flex: 0 0 auto; border-radius: 14px; overflow: hidden; text-align: center; background: var(--bg-2); box-shadow: var(--shadow); }
.when .cal-ic .m { display: block; background: var(--accent); color: var(--on-accent); font-family: var(--f-mono); font-weight: 700; font-size: 11px; letter-spacing: .16em; padding: 4px 0; }
.when .cal-ic .dd { display: block; font-family: var(--f-display); font-stretch: 120%; font-weight: 900; font-size: 34px; line-height: 1.15; padding: 2px 0 6px; }
.when .info { display: grid; gap: 2px; min-width: 0; }
.when .info b { font-family: var(--f-display); font-stretch: 110%; font-weight: 850; font-size: 20px; text-transform: uppercase; line-height: 1.1; }
.when .cd { font-family: var(--f-mono); font-size: 12.5px; font-weight: 700; color: var(--accent); }
.when .tl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.when .tl div { border-radius: 10px; background: var(--bg-2); padding: 8px 10px; display: grid; gap: 1px; }
.when .tl div:last-child { background: var(--accent-soft); }
.when .tl span { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.when .tl b { font-family: var(--f-mono); font-size: 14px; }
.when .tl div:last-child b { color: var(--accent); }
.postchip { justify-self: start; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--on-accent); font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px; border-radius: 10px; }
.day.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.legend { display: grid; gap: 10px; }
.lg { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); align-items: center; }
.lg .d { font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.lg .d.c { color: var(--cobalt); font-size: 13px; line-height: 1.3; }
.lg div:last-child { font-size: 14.5px; color: var(--muted); }
.lg b { display: block; font-weight: 700; font-size: 15px; color: var(--ink); }

/* creator */
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 0; font-size: 14px; font-weight: 600; }
.back:hover { color: var(--ink); }
.chero { padding-block: 28px 40px; position: relative; overflow: hidden; }
.chero::before { content: ""; position: absolute; right: -10%; top: -60%; width: 60vw; max-width: 760px; aspect-ratio: 1; border-radius: 50%; background: var(--cg); opacity: .18; filter: blur(80px); pointer-events: none; }
.chero .wrap { position: relative; display: grid; gap: 20px; }
.chero .main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; }
.chero .idrow { display: flex; align-items: center; gap: 16px; }
.chero .av { width: 72px; height: 72px; font-size: 26px; box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent); }
.chero h1 { font-size: clamp(40px, 7.2vw, 96px); margin-top: 14px; }
.chero .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); text-decoration: none; }
a.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip b { color: var(--ink); font-weight: 700; }
.niche { margin: 14px 0 0; color: var(--muted); max-width: 62ch; font-size: 17px; }

.ticket { --stub: 118px; position: relative; display: grid; grid-template-columns: auto var(--stub); background: var(--accent); color: var(--on-accent); border-radius: 18px; box-shadow: 0 24px 60px -20px color-mix(in srgb, var(--accent) 70%, transparent); transform: rotate(-2deg); transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.ticket:hover { transform: rotate(0); }
.ticket .l { padding: 18px 24px; display: grid; gap: 4px; }
.ticket .l .label { color: var(--on-accent); opacity: .75; }
.ticket .code { font-family: var(--f-mono); font-weight: 700; font-size: clamp(26px, 3.4vw, 36px); letter-spacing: .05em; line-height: 1.1; }
.ticket .l .sub { font-size: 12.5px; opacity: .8; }
.ticket .r { border-left: 2px dashed color-mix(in srgb, var(--on-accent) 40%, transparent); display: grid; place-items: center; padding: 10px; }
.ticket::before, .ticket::after { content: ""; position: absolute; right: calc(var(--stub) - 11px); width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.ticket::before { top: -11px; } .ticket::after { bottom: -11px; }
.btn-copy { appearance: none; border: 1.5px solid currentColor; background: transparent; color: inherit; font: 700 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; padding: 10px 12px; border-radius: 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: background .2s; }
.btn-copy:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.btn-copy svg { width: 14px; height: 14px; }

.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-block: 1px solid var(--line); }
.rail .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; align-items: center; }
.rail .wrap::-webkit-scrollbar { display: none; }
.rail button { flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
.rail button:hover { color: var(--ink); background: var(--surface); }
.rail button.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
.rail .prog { margin-left: auto; display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); flex: 0 0 auto; padding-left: 12px; }
.rail .bar { width: 80px; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.rail .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }

.csec { padding-block: 56px 8px; scroll-margin-top: 70px; }

.read { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.insights { display: grid; gap: 12px; }
.ins { display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding: 18px 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.ins .i { width: 36px; height: 36px; border-radius: 10px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; }
.ins .i svg { width: 18px; height: 18px; }
.ins p { margin: 0; font-size: 15.5px; }
.tone { border-radius: var(--r-lg); padding: 28px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 14px; align-content: start; position: relative; overflow: hidden; }
.tone q { font-family: var(--f-display); font-stretch: 105%; font-weight: 800; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.15; quotes: none; text-wrap: balance; }
.tone .mark { position: absolute; right: 18px; bottom: -70px; font-family: var(--f-display); font-weight: 900; font-size: 220px; line-height: 1; color: var(--accent); opacity: .14; }

.reels { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 44px; align-items: start; }
.phone { position: sticky; top: 84px; width: 100%; max-width: 320px; aspect-ratio: 9 / 19; border-radius: 46px; background: var(--device); padding: 10px; box-shadow: 0 0 0 1.5px #2a2f55, 0 40px 80px -30px rgba(0,0,0,.6); }
.screen { position: relative; height: 100%; border-radius: 37px; overflow: hidden; background: var(--cg); color: var(--device-ink); }
.screen::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 60% at 50% 100%, rgba(0,0,0,.7), transparent 60%), radial-gradient(80% 40% at 50% 0%, rgba(0,0,0,.35), transparent 70%); }
.screen .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 90px; height: 24px; border-radius: 20px; background: var(--device); z-index: 2; }
.screen .tbar { position: absolute; top: 46px; left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 17px; z-index: 2; }
.screen .ost { position: absolute; left: 18px; right: 58px; top: 40%; transform: translateY(-50%); z-index: 2; }
.screen .ost span { background: #fff; color: #111; font-weight: 700; font-size: 17px; line-height: 1.5; padding: 4px 8px; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.screen .side { position: absolute; right: 12px; bottom: 130px; display: grid; gap: 20px; z-index: 2; }
.screen .side svg { width: 26px; height: 26px; display: block; }
.screen .bottom { position: absolute; left: 14px; right: 58px; bottom: 22px; z-index: 2; display: grid; gap: 8px; font-size: 13px; }
.screen .who { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.screen .who > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen .who .av { width: 28px; height: 28px; font-size: 11px; box-shadow: 0 0 0 1.5px #fff; }
.screen .who .fol { border: 1px solid rgba(255,255,255,.7); border-radius: 8px; padding: 2px 8px; font-size: 12px; flex: 0 0 auto; }
.screen .cap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.screen .cap .cp { color: #ffd2bd; }
.screen .aud { display: flex; gap: 6px; align-items: center; font-size: 12px; opacity: .9; white-space: nowrap; overflow: hidden; }
.screen .pg { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); z-index: 3; }
.screen .pg i { display: block; height: 100%; width: 0; background: #fff; animation: play 9s linear infinite; }
@keyframes play { to { width: 100%; } }

.rdet { display: grid; gap: 26px; min-width: 0; }
.rdet .title { font-family: var(--f-display); font-stretch: 112%; font-weight: 850; font-size: clamp(26px, 3.2vw, 38px); line-height: 1.05; margin: 8px 0 0; text-wrap: balance; }
.sell { border-radius: var(--r); padding: 18px 20px; background: var(--cobalt-soft); border: 1px solid color-mix(in srgb, var(--cobalt) 35%, transparent); display: grid; gap: 6px; }
.sell .label { color: var(--cobalt); }
.sell div { font-size: 16.5px; font-weight: 600; }
.hook { border-radius: var(--r); padding: 18px 20px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); display: grid; gap: 6px; }
.hook .label { color: var(--accent); }
.hook div { font-size: 16.5px; }
.scene { display: grid; grid-template-columns: 44px 1fr; gap: 16px; padding-bottom: 22px; position: relative; }
.scene::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 2px; background: var(--line); }
.scene:last-child { padding-bottom: 0; }
.scene:last-child::before { display: none; }
.scene .n { width: 44px; height: 44px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-stretch: 118%; font-weight: 900; font-size: 17px; color: var(--cobalt); position: relative; z-index: 1; }
.scene .tx { padding-top: 4px; }
.scene .tx .label { display: block; margin-bottom: 3px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fact { padding: 16px 18px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; font-size: 15px; }
.caption { padding: 18px 20px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 12px; }
.caption p { margin: 0; font-size: 15.5px; }
.caption .btn-copy { justify-self: start; color: var(--cobalt); }
.why { display: grid; grid-template-columns: 4px 1fr; gap: 14px; color: var(--muted); font-size: 15px; }
.why::before { content: ""; background: var(--accent); border-radius: 4px; }
.why b { color: var(--ink); }

.strow { display: grid; grid-auto-flow: column; grid-auto-columns: 240px; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 4px 22px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.story { scroll-snap-align: start; aspect-ratio: 9 / 16; border-radius: 20px; position: relative; overflow: hidden; color: #fff; background: var(--sg); box-shadow: var(--shadow); display: flex; flex-direction: column; padding: 12px 14px 16px; transition: transform .25s; }
.story:hover { transform: translateY(-4px); }
.story::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.28), transparent 30%, transparent 55%, rgba(0,0,0,.45)); pointer-events: none; }
.story > * { position: relative; }
.story .segs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.story .segs i { height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.35); }
.story .segs i.done { background: #fff; }
.story .who { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; font-weight: 700; }
.story .who .av { width: 24px; height: 24px; font-size: 9.5px; box-shadow: 0 0 0 1.5px #fff; }
.story .who small { font-weight: 500; opacity: .75; }
.story h4 { margin: 16px 0 8px; font-family: var(--f-display); font-stretch: 112%; font-weight: 900; text-transform: uppercase; font-size: 20px; line-height: 1; text-wrap: balance; }
.story .what { font-size: 12.5px; line-height: 1.4; opacity: .92; }
.story .what i { font-style: normal; font-weight: 600; }
.story .say { margin-top: auto; background: #fff; color: #141414; border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.35; font-weight: 500; box-shadow: 0 8px 18px rgba(0,0,0,.25); transform: rotate(-1.5deg); }
.story .say .cp { color: #e5480f; }
.story .stk { align-self: center; margin-top: 12px; background: linear-gradient(90deg, #ff6b2c, #ff3d7f); color: #fff; font-family: var(--f-mono); font-weight: 700; font-size: 13px; letter-spacing: .06em; padding: 7px 12px; border-radius: 9px; box-shadow: 0 6px 16px rgba(0,0,0,.25); transform: rotate(2deg); white-space: nowrap; }
.story .stk small { font-weight: 500; opacity: .85; margin-right: 6px; }
.hint { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 13px; }

.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.sd { border-radius: var(--r); padding: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.sd .d { font-family: var(--f-display); font-stretch: 120%; font-weight: 900; font-size: 30px; line-height: 1; color: var(--cobalt); text-transform: uppercase; }
.sd.opt { background: transparent; border-style: dashed; }
.sd.opt .d { color: var(--faint); }
.sd p { margin: 0; font-size: 14.5px; }
.note { margin-top: 18px; padding: 16px 18px; border-radius: var(--r); background: var(--cobalt-soft); font-size: 15px; display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
.note svg { width: 20px; height: 20px; color: var(--cobalt); margin-top: 1px; }

.check { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; }
.ring { border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); padding: 26px; display: grid; justify-items: center; align-content: center; gap: 12px; text-align: center; }
.ring .rw { position: relative; width: 150px; height: 150px; }
.ring svg { width: 150px; height: 150px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 12; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1); }
.ring .pc { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-stretch: 120%; font-weight: 900; font-size: 38px; font-variant-numeric: tabular-nums; }
.ring p { margin: 0; color: var(--muted); font-size: 14px; }
.tasks { display: grid; gap: 12px; }
.tgroup { border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); padding: 8px; }
.tgroup .gh { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px; }
.tlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 4px; }
.task { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer; font-size: 15px; user-select: none; }
.task:hover { background: var(--bg-2); }
.task input { position: absolute; opacity: 0; pointer-events: none; }
.task .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--faint); display: grid; place-items: center; flex: 0 0 auto; transition: background .2s, border-color .2s; }
.task .box svg { width: 14px; height: 14px; color: #fff; opacity: 0; transform: scale(.5); transition: opacity .2s, transform .2s; }
.task input:checked + .box { background: var(--ok); border-color: var(--ok); }
.task input:checked + .box svg { opacity: 1; transform: none; }
.task input:checked ~ span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.task input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.task small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }

.next { margin-top: 64px; display: grid; gap: 14px; }
.next .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 12px; }
.nx { text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); transition: border-color .2s; }
.nx:hover { border-color: var(--accent); }
.nx .av { width: 36px; height: 36px; font-size: 13px; }
.nx b { display: block; font-size: 15px; }
.nx small { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; }

footer { margin-top: 70px; border-top: 1px solid var(--line); }
footer .wrap { padding-block: 26px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--faint); font-size: 13px; font-family: var(--f-mono); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 16px; height: 16px; color: var(--ok); flex: 0 0 auto; }

@media (max-width: 900px) {
  .reels { grid-template-columns: minmax(0, 1fr); }
  .phone { position: relative; top: 0; margin: 0 auto; max-width: 290px; }
  .calwrap, .read, .check { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .score { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .score > div:nth-child(2) { border-right: 0; }
  .score > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .deliver, .facts { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chero .main { grid-template-columns: minmax(0, 1fr); }
  .ticket { justify-self: start; --stub: 104px; }
  .ticket .l { padding: 16px 18px; }
  .pill span.n { display: none; }
  .pill { padding: 4px; }
  .day { font-size: 11px; padding: 4px 5px; border-radius: 7px; }
  .day .dot { width: 4px; height: 4px; }
  .rail .bar { display: none; }
  .strow { grid-auto-columns: 220px; }

  /* top bar: logo + all 5 creators fit on one line */
  .top .wrap { gap: 10px; min-height: 58px; }
  .brand .logo { height: 26px; }
  .people { gap: 2px; padding: 4px 0; }
  .pill { padding: 3px; border: 0; }
  .pill .av { width: 32px; height: 32px; font-size: 11.5px; }
  .pill[aria-current="page"] { background: transparent; }
  .pill[aria-current="page"] .av { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

  /* home */
  .hero { padding-block: 36px 32px; }
  .hero h1 { font-size: clamp(34px, 10.2vw, 48px); }
  .lg .d.c { font-size: 12px; }
  .hero .wrap { gap: 18px; }
  section.block { padding-block: 30px; }
  .sec-head { margin-bottom: 18px; }
  .score > div { padding: 16px; }
  .score .v { font-size: 30px; font-stretch: 108%; white-space: nowrap; }
  .score .v small { font-size: .5em; margin-left: 2px; }
  .card { padding: 18px; gap: 14px; }
  .card .av { width: 46px; height: 46px; font-size: 16px; }
  .card .nm { font-size: 18px; }
  .dv { padding: 22px; }
  .dv .big { font-size: 56px; }
  .rule { padding: 14px 16px; }
  .lg { grid-template-columns: 78px 1fr; padding: 12px 14px; }
  .cal { padding: 12px; }
  .cal .dow, .cal .grid { gap: 4px; }

  /* creator */
  .chero { padding-block: 18px 30px; }
  .chero .av { width: 56px; height: 56px; font-size: 20px; }
  .chero h1 { font-size: clamp(34px, 11vw, 46px); overflow-wrap: anywhere; }
  .chip { font-size: 13px; padding: 5px 10px; }
  .niche { font-size: 16px; }

function countdown(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((new Date(2026, 9, d) - t) / 864e5);
  return n > 1 ? `faltam ${n} dias` : n === 1 ? 'é amanhã!' : n === 0 ? 'é hoje!' : 'já foi ao ar';
}

/* calendar: October 2026 */
const MON = { y: 2026, m: 9 };
function calendar() {
  const off = (new Date(MON.y, MON.m, 1).getDay() + 6) % 7;
  const days = new Date(MON.y, MON.m + 1, 0).getDate();
  const ev = { 12: 'ev', 31: 'ev' };
  const postBy = {}; DATA.pessoas.forEach(p => { postBy[p.post.d] = p; });
  const now = new Date();
  const isMonth = now.getFullYear() === MON.y && now.getMonth() === MON.m;
  let cells = '';
  for (let i = 0; i < off; i++) cells += '<div class="day empty"></div>';
  for (let d = 1; d <= days; d++) {
    const dow = (off + d - 1) % 7;
    const story = d >= 5 && (dow === 0 || dow === 2 || dow === 4);
    const today = isMonth && now.getDate() === d ? 'today' : '';
    const pp = postBy[d];
    if (pp) { cells += `<button type="button" class="day post ${today}" data-go="${pp.slug}" style="--pg:${pp.grad}" aria-label="${esc(pp.nome)} posta o Reels em ${pp.post.data}"><span>${String(d).padStart(2, '0')}</span><span class="ini">${pp.ini}</span></button>`; continue; }
    const cls = ['day', ev[d] || '', today].join(' ');
    cells += `<div class="${cls}"><span>${String(d).padStart(2, '0')}</span>${story ? '<span class="dots"><span class="dot"></span></span>' : '<span></span>'}</div>`;
  }
  return `<div class="cal" role="img" aria-label="Calendário de outubro de 2026 com a data do Reels de cada criador e os dias de Stories">
    <div class="dow">${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].map(x => `<div>${x}</div>`).join('')}</div>
    <div class="grid">${cells}</div></div>`;
}

function updateProgress() {
  const all = [...document.querySelectorAll('[data-task]')];
  const n = all.filter(x => x.checked).length, tot = all.length;
  const pct = tot ? Math.round(n / tot * 100) : 0;
  const set = (id, fn) => { const el = document.getElementById(id); if (el) fn(el); };
  set('pbar', el => el.style.width = pct + '%');
  set('ptxt', el => el.textContent = `${n}/${tot}`);
  set('ringfg', el => el.style.strokeDashoffset = 414.69 * (1 - pct / 100));
  set('ringpc', el => el.textContent = pct + '%');
  set('ringtx', el => el.textContent = pct === 100 ? 'Mês fechado. Mandou bem!' : pct >= 50 ? 'Mais da metade, segue firme' : n ? 'Começou bem' : 'Bora começar');
}

/* ---------- animations (Motion) ---------- */
const FX = window.Motion || null;
if (FX) document.documentElement.classList.add('has-motion');
const EASE = [.2, .75, .2, 1];
const SPRING = { type: 'spring', stiffness: 420, damping: 22 };

function splitWords(el) {
  if (!el || el.dataset.split) return el ? el.querySelectorAll('.wi') : [];
  el.dataset.split = '1';
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const frag = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const w = document.createElement('span'); w.className = 'w';
        const i = document.createElement('span'); i.className = 'wi'; i.textContent = part;
        w.appendChild(i); frag.appendChild(w);
      });
      c.replaceWith(frag);
    } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c);
  });
  walk(el);
  return el.querySelectorAll('.wi');
}

/* hide now, play when it scrolls into view */
function onEnter(el, hide, play, amount = .15) {
  if (!el) return;
  hide();
  FX.inView(el, () => { play(); }, { amount });
}
const hideAll = (els, y = 60) => els.forEach(e => { e.style.opacity = 0; e.style.transform = `translateY(${y}px)`; });

function tilt(el, max = 7) {
  if (!el || matchMedia('(hover: none)').matches) return;
  el.classList.add('tilt');
  el.addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    FX.animate(el, { rotateY: x * max, rotateX: -y * max, transformPerspective: 900 }, { type: 'spring', stiffness: 260, damping: 22 });
  });
  el.addEventListener('pointerleave', () => FX.animate(el, { rotateY: 0, rotateX: 0 }, { type: 'spring', stiffness: 200, damping: 18 }));
}

function countUp(root) {
  root.querySelectorAll('.num[data-to]').forEach((el, i) => {
    const to = parseFloat(el.dataset.to), dec = +(el.dataset.dec || 0);
    const fmt = v => v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    el.textContent = fmt(0);
    FX.animate(0, to, { duration: 1.8, delay: .6 + i * .1, ease: [.16, 1, .3, 1], onUpdate: v => { el.textContent = fmt(v); } });
  });
}

function reveal(root) {
  /* section titles: words rise one by one */
  root.querySelectorAll('.sec-head').forEach(head => {
    const words = splitWords(head.querySelector('.h2'));
    const rest = [...head.querySelectorAll('.eyebrow, p')];
    onEnter(head, () => {
      words.forEach(w => { w.style.transform = 'translateY(110%)'; });
      rest.forEach(e => { e.style.opacity = 0; e.style.transform = 'translateY(20px)'; });
    }, () => {
      FX.animate(words, { y: ['110%', '0%'], rotate: [5, 0] }, { duration: .8, ease: EASE, delay: FX.stagger(.06) });
      FX.animate(rest, { opacity: [0, 1], y: [20, 0] }, { duration: .7, ease: EASE, delay: FX.stagger(.15) });
    }, .3);
  });
  /* single blocks */
  root.querySelectorAll('[data-rv]:not(.sec-head)').forEach(el => {
    onEnter(el, () => hideAll([el], 50), () => FX.animate(el, { opacity: [0, 1], y: [50, 0], filter: ['blur(8px)', 'blur(0px)'] }, { duration: .9, ease: EASE }), .2);
  });
  /* groups: children arrive one after another */
  root.querySelectorAll('[data-stg]').forEach(box => {
    const kind = box.dataset.stg, kids = [...box.children];
    if (kind === 'story') {
      onEnter(box, () => kids.forEach(k => { k.style.opacity = 0; k.style.transform = 'translateX(140px) rotate(8deg)'; }),
        () => FX.animate(kids, { opacity: [0, 1], x: [140, 0], rotate: [8, 0] }, { type: 'spring', bounce: .35, duration: 1, delay: FX.stagger(.1) }), .2);
    } else if (kind === 'scene') {
      onEnter(box, () => kids.forEach(k => { k.style.opacity = 0; k.style.transform = 'translateX(-40px)'; }), () => {
        FX.animate(kids, { opacity: [0, 1], x: [-40, 0] }, { duration: .7, ease: EASE, delay: FX.stagger(.14) });
        FX.animate(box.querySelectorAll('.n'), { scale: [.3, 1], rotate: [-30, 0] }, { type: 'spring', bounce: .55, duration: .8, delay: FX.stagger(.14, { startDelay: .1 }) });
      }, .15);
    } else {
      onEnter(box, () => hideAll(kids, 70),
        () => FX.animate(kids, { opacity: [0, 1], y: [70, 0], scale: [.94, 1], filter: ['blur(6px)', 'blur(0px)'] }, { duration: .85, ease: EASE, delay: FX.stagger(.09) }), .1);
    }
  });
}

/* buttons: press, hover lift, copy success */
function pressable(root) {
  root.querySelectorAll('button, a.chip').forEach(b => {
    if (b.dataset.fx) return; b.dataset.fx = '1';
    const big = b.matches('.card, .nx');
    b.addEventListener('pointerdown', () => FX.animate(b, { scale: big ? .97 : .9 }, SPRING));
    const up = () => FX.animate(b, { scale: 1 }, { type: 'spring', stiffness: 500, damping: 14 });
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    if (b.matches('.pill, .rail button, .back, a.chip, .btn-copy')) {
      b.addEventListener('pointerenter', () => FX.animate(b, { y: -3 }, SPRING));
      b.addEventListener('pointerleave', () => FX.animate(b, { y: 0 }, SPRING));
    }
  });
}
function copyPop(btn) {
  if (!FX || !btn) return;
  const old = btn.innerHTML;
  btn.innerHTML = I.check + 'Copiado';
  FX.animate(btn, { scale: [.85, 1.12, 1] }, { duration: .45 });
  FX.animate(btn.querySelector('svg'), { scale: [0, 1.4, 1], rotate: [-45, 0] }, { duration: .5 });
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.innerHTML = old; }, 1600);
}

function animateView(isCreator) {
  const app = document.getElementById('app');
  if (!isCreator) {
    FX.animate(splitWords(app.querySelector('.hero h1')), { y: ['110%', '0%'], rotate: [6, 0] }, { duration: 1, ease: EASE, delay: FX.stagger(.08, { startDelay: .1 }) });
    FX.animate(app.querySelectorAll('.hero .eyebrow, .hero .lede'), { opacity: [0, 1], y: [24, 0] }, { duration: .8, ease: EASE, delay: FX.stagger(.3) });
    FX.animate(app.querySelectorAll('.score > div'), { opacity: [0, 1], y: [40, 0], scale: [.9, 1] }, { type: 'spring', bounce: .35, duration: .9, delay: FX.stagger(.1, { startDelay: .5 }) });
    countUp(app);
    const cal = app.querySelector('.cal'), days = [...app.querySelectorAll('.day:not(.empty)')];
    onEnter(cal, () => days.forEach(d => { d.style.opacity = 0; d.style.transform = 'scale(.4)'; }),
      () => FX.animate(days, { opacity: [0, 1], scale: [.4, 1] }, { type: 'spring', bounce: .5, duration: .6, delay: FX.stagger(.022) }), .25);
    app.querySelectorAll('.card').forEach(c => tilt(c, 6));
  } else {
    FX.animate(splitWords(app.querySelector('.chero h1')), { y: ['110%', '0%'] }, { duration: .9, ease: EASE, delay: FX.stagger(.09, { startDelay: .15 }) });
    FX.animate(app.querySelector('.chero .idrow .av'), { scale: [0, 1], rotate: [-120, 0] }, { type: 'spring', bounce: .5, duration: .9 });
    FX.animate(app.querySelectorAll('.chero .idrow .eyebrow, .chero .back'), { opacity: [0, 1], x: [-20, 0] }, { duration: .6, ease: EASE, delay: FX.stagger(.08) });
    FX.animate(app.querySelectorAll('.chero .chip, .chero .niche'), { opacity: [0, 1], y: [16, 0] }, { duration: .6, ease: EASE, delay: FX.stagger(.07, { startDelay: .5 }) });
    FX.animate(app.querySelector('.ticket'), { opacity: [0, 1], y: [-140, 0], rotate: [-22, -2] }, { type: 'spring', bounce: .5, duration: 1.2, delay: .45 });
    FX.animate(app.querySelector('.rail'), { opacity: [0, 1], y: [-10, 0] }, { duration: .5, delay: .7 });
    const phone = app.querySelector('.phone');
    const parts = [phone.querySelector('.ost span'), ...phone.querySelectorAll('.side svg'), ...phone.querySelectorAll('.bottom > *')];
    onEnter(phone, () => { phone.style.opacity = 0; phone.style.transform = 'translateY(120px) rotate(-6deg)'; parts.forEach(x => { x.style.opacity = 0; }); }, () => {
      FX.animate(phone, { opacity: [0, 1], y: [120, 0], rotate: [-6, 0] }, { type: 'spring', bounce: .3, duration: 1.2 });
      FX.animate(phone.querySelector('.ost span'), { scale: [.3, 1], opacity: [0, 1] }, { type: 'spring', bounce: .55, duration: .8, delay: .55 });
      FX.animate(phone.querySelectorAll('.side svg'), { scale: [0, 1], opacity: [0, 1] }, { type: 'spring', bounce: .6, duration: .6, delay: FX.stagger(.1, { startDelay: .8 }) });
      FX.animate(phone.querySelectorAll('.bottom > *'), { opacity: [0, 1], y: [16, 0] }, { duration: .5, delay: FX.stagger(.1, { startDelay: .9 }) });
    }, .2);
    tilt(app.querySelector('.ticket'), 10);
    tilt(phone, 8);
  }
  reveal(app);
  pressable(document);
}

if (FX) {
  FX.scroll(FX.animate('#readbar', { scaleX: [0, 1] }, { ease: 'linear' }));
  const logo = document.querySelector('.brand .logo');
  FX.animate(logo, { opacity: [0, 1], y: [-16, 0] }, { duration: .7, ease: EASE });
  document.querySelector('.brand').addEventListener('pointerenter', () => FX.animate(logo, { rotate: [0, -4, 3, 0], scale: [1, 1.08, 1.05] }, { duration: .5 }));
  document.querySelector('.brand').addEventListener('pointerleave', () => FX.animate(logo, { scale: 1, rotate: 0 }, SPRING));
}

/* ---------- checklist sync (Vercel API; falls back to this device only) ---------- */
const API = '/api/checklist';
let online = false;
async function loadRemote(slug) {
  try {
    const r = await fetch(`${API}?slug=${encodeURIComponent(slug)}`, { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.tasks ? j.tasks : null;
  } catch { return null; }
}
function saveRemote(slug, task, done) {
  if (!online) return;
  fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ slug, task, done }) })
    .then(r => { if (!r.ok) throw new Error(); })
    .catch(() => toast('Não salvou no painel. Confere a internet e marca de novo.'));
}
async function syncChecklist(slug) {
  const remote = await loadRemote(slug);
  if (!remote || current !== slug) return;
  online = true;
  const k = 'skyfit-out26-' + slug, local = store.get(k);
  document.querySelectorAll('[data-task]').forEach(el => {
    const id = el.dataset.task;
    if (id in remote) el.checked = !!remote[id];
    else if (local[id]) saveRemote(slug, id, true);
    local[id] = el.checked;
  });
  store.set(k, local);
  updateProgress();
  const st = document.getElementById('syncst');
  if (st) st.textContent = 'Fica salvo e a gestão acompanha em tempo real.';
}

let current = '', spy = null;
function render(id, fromNav) {
  const p = DATA.pessoas.find(x => x.slug === id);
  current = p ? p.slug : '';
  $('#people').innerHTML = DATA.pessoas.map(x => `<button class="pill" type="button" data-go="${x.slug}" aria-label="${esc(x.nome)}" ${x.slug === current ? 'aria-current="page"' : ''}>${av(x)}<span class="n">${esc(x.first)}</span></button>`).join('');
  $('#app').innerHTML = p ? creator(p) : home();
  document.title = p ? `${p.first} · Skyfit Outubro` : 'Skyfit Santa Isabel · Outubro';
  if (fromNav) window.scrollTo(0, 0);
  const act = $('#people [aria-current]'); if (act) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  if (p) { updateProgress(); setupSpy(); syncChecklist(p.slug); }
  if (FX) { FX.animate('#app', { opacity: 1, y: 0 }, { duration: 0 }); animateView(!!p); }
}
let leaving = false;
async function go(id) {
  if (leaving || (id && id === current)) return;
  try { history.pushState(null, '', id ? '#' + id : location.pathname + location.search); } catch {}
  if (FX) { leaving = true; try { await FX.animate('#app', { opacity: [1, 0], y: [0, -14] }, { duration: .2, ease: 'easeIn' }).finished; } catch {} leaving = false; }
  render(id, true);
}
function setupSpy() {
  if (spy) removeEventListener('scroll', spy);
  let ticking = false, last = '';
  const update = () => {
    ticking = false;
    const secs = [...document.querySelectorAll('.csec')];
    if (!secs.length) return;
    const line = innerHeight * .3;
    let cur = secs[0].id;
    secs.forEach(s => { if (s.getBoundingClientRect().top <= line) cur = s.id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1].id;
    if (cur === last) return;
    last = cur;
    document.querySelectorAll('.rail [data-sec]').forEach(b => {
      const on = b.dataset.sec === cur;
      b.classList.toggle('on', on);
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  };
  spy = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
  addEventListener('scroll', spy, { passive: true });
  update();
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { copyPop(c); return copy(c.dataset.copy, c.dataset.msg); }
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const s = e.target.closest('[data-sec]'); if (s) { const el = document.getElementById(s.dataset.sec); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-task]'); if (!t || !current) return;
  const k = 'skyfit-out26-' + current, st = store.get(k); st[t.dataset.task] = t.checked; store.set(k, st);
  saveRemote(current, t.dataset.task, t.checked);
  updateProgress();
  if (FX) FX.animate(t.nextElementSibling, { scale: [1, 1.35, 1], rotate: t.checked ? [0, -10, 0] : 0 }, { duration: .4 });
  if (t.checked) toast('Marcado como feito');
});
window.addEventListener('popstate', () => render(location.hash.slice(1), true));
render(location.hash.slice(1), false);
</script>
